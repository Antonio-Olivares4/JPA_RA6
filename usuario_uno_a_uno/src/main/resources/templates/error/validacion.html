<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error de Validación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="alert alert-danger" role="alert">
            <h4 class="alert-heading">Error de Validación</h4>
            <p th:text="${mensajeError}"></p>
            <hr>
            <p class="mb-0">Por favor, verifica los datos ingresados e intenta nuevamente.</p>
        </div>
        <a th:href="@{/usuarios}" class="btn btn-primary">Volver al listado de usuarios</a>
    </div>
</body>
</html>
